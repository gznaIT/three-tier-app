version: '3.8'

services:
  database:
    image: mongo
    container_name: mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: ghcr.io/gznait/three-tier-app-backend:latest
    container_name: backend
    ports:
      - "5001:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env

  frontend:
    image: ghcr.io/gznait/three-tier-app-frontend:latest
    container_name: frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongo-data:
