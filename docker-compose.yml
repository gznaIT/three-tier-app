version: '3.8'

services:
  database:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: 913615820610.dkr.ecr.us-east-1.amazonaws.com/backend:6
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env

  frontend:
    image: 913615820610.dkr.ecr.us-east-1.amazonaws.com/frontend:6
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
